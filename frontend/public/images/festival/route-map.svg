<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#fdfaf3; font-family:sans-serif;">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Grid / Map Tile Effect -->
  <rect x="0" y="0" width="800" height="450" fill="#FFF9F0"/>
  <path d="M 0,90 L 800,90 M 0,180 L 800,180 M 0,270 L 800,270 M 0,360 L 800,360" stroke="#e8d5bf" stroke-width="1" stroke-dasharray="6,6" opacity="0.4"/>
  <path d="M 160,0 L 160,450 M 320,0 L 320,450 M 480,0 L 480,450 M 640,0 L 640,450" stroke="#e8d5bf" stroke-width="1" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Water Body / Sea / Canal on Right Side for Immersion -->
  <path d="M 680,0 Q 640,150 670,300 T 650,450 L 800,450 L 800,0 Z" fill="#e0f2fe" opacity="0.85"/>
  <path d="M 690,30 Q 660,160 680,290 T 665,450" stroke="#0284c7" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="8,6"/>
  <text x="735" y="230" fill="#0369a1" font-size="14" font-weight="bold" transform="rotate(90,735,230)" letter-spacing="3">IMMERSION GHAT (నిమజ్జనం)</text>

  <!-- Surrounding Secondary Roads -->
  <path d="M 50,220 L 750,220" stroke="#f1e0cf" stroke-width="16" stroke-linecap="round"/>
  <path d="M 280,40 L 280,410" stroke="#f1e0cf" stroke-width="14" stroke-linecap="round"/>
  <path d="M 520,30 L 520,390" stroke="#f1e0cf" stroke-width="14" stroke-linecap="round"/>

  <!-- Main Procession Route Road Outline -->
  <path d="M 100,140 L 280,140 L 280,310 L 520,310 L 520,180 L 680,180" 
        fill="none" stroke="#fed7aa" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active Procession Route Line (Orange Glow) -->
  <path d="M 100,140 L 280,140 L 280,310 L 520,310 L 520,180 L 680,180" 
        fill="none" stroke="url(#roadGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10,6"/>

  <!-- Direction Arrows on Route -->
  <polygon points="190,135 205,140 190,145" fill="#c2410c"/>
  <polygon points="275,220 280,235 285,220" fill="#c2410c"/>
  <polygon points="390,305 405,310 390,315" fill="#c2410c"/>
  <polygon points="515,250 520,235 525,250" fill="#c2410c"/>
  <polygon points="595,175 610,180 595,185" fill="#c2410c"/>

  <!-- Checkpoint 1: Starting Temple -->
  <g transform="translate(100, 140)" filter="url(#shadow)">
    <circle r="22" fill="#ea580c"/>
    <circle r="8" fill="#ffffff"/>
    <text x="0" y="42" fill="#2D1B11" font-size="13" font-weight="bold" text-anchor="middle">🚩 START: Ramalayam Temple</text>
    <text x="0" y="58" fill="#78350f" font-size="11" text-anchor="middle">(64QC+V49 Suryaraopet)</text>
  </g>

  <!-- Checkpoint 2: Main Bazaar / Chowk -->
  <g transform="translate(280, 310)" filter="url(#shadow)">
    <circle r="16" fill="#f59e0b"/>
    <circle r="6" fill="#ffffff"/>
    <text x="0" y="32" fill="#2D1B11" font-size="12" font-weight="bold" text-anchor="middle">📍 Gandhi Chowk Junction</text>
    <text x="0" y="46" fill="#6b7280" font-size="10" text-anchor="middle">Devotee Aarti Point</text>
  </g>

  <!-- Checkpoint 3: Main Road Pedana Link -->
  <g transform="translate(520, 180)" filter="url(#shadow)">
    <circle r="16" fill="#f59e0b"/>
    <circle r="6" fill="#ffffff"/>
    <text x="0" y="-24" fill="#2D1B11" font-size="12" font-weight="bold" text-anchor="middle">📍 Machilipatnam Link Road</text>
    <text x="0" y="-10" fill="#6b7280" font-size="10" text-anchor="middle">Grand Dappu &amp; Bhajan Stage</text>
  </g>

  <!-- Checkpoint 4: Immersion Destination -->
  <g transform="translate(680, 180)" filter="url(#shadow)">
    <circle r="24" fill="#0284c7"/>
    <circle r="10" fill="#ffffff"/>
    <text x="0" y="42" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">🌊 END: Immersion Ghat</text>
    <text x="0" y="58" fill="#0284c7" font-size="11" text-anchor="middle">Final Maha Aarti &amp; Visarjan</text>
  </g>

  <!-- Route Info Header Badge -->
  <rect x="25" y="25" width="270" height="55" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="40" y="47" fill="#ea580c" font-size="13" font-weight="bold">🚩 MAHA NIMAJJANAM ROUTE</text>
  <text x="40" y="66" fill="#4b5563" font-size="11">Total Distance: ~3.5 KM • Suryaraopet</text>
</svg>
